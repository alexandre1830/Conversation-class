<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hey, Teacher!</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/styles.css">
</head>
<body class="landing-page">

  <div class="bg-grid" aria-hidden="true"></div>

  <div class="landing-container">

    <a href="index.html" class="back-btn landing-back" aria-label="Back to activities">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M19 12H5M5 12l7-7M5 12l7 7"/>
      </svg>
      Activities
    </a>

    <header class="landing-header">
      <div class="logo">
        <span class="logo-cap" aria-hidden="true"><img src="images/logo.png" width="200px" alt="Hey, Teacher! Logo"></span>
      </div>
      <div class="activity-heading">
        <span class="activity-kicker" id="activity-kicker">&nbsp;</span>
        <h1 class="menu-title" id="activity-title">&nbsp;</h1>
      </div>
      <p class="select-prompt">Select a CEFR level to begin.</p>
    </header>

    <main class="levels-grid" id="levels-grid" aria-label="CEFR levels">
      <!-- Generated by menu.js -->
    </main>

    <footer class="landing-footer">
      <p>Hey, Teacher!™</p>
    </footer>

  </div>

  <script src="scripts/common.js"></script>
  <script src="scripts/menu.js"></script>
</body>
</html>
